[project]
name = "heartbeat"
version = "1.1.0"
description = "Modular network heartbeat checker with SQLite store-and-forward and MQTT publishing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "paho-mqtt>=2.1,<3",
]

[project.scripts]
heartbeat = "heartbeat.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartbeat"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
